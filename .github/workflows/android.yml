name: Android build and regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Lint, JVM tests and APK builds
        run: set -o pipefail; ./gradlew --no-daemon --max-workers=2 lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest 2>&1 | tee build.log
      - name: Save successful build before device tests
        uses: actions/upload-artifact@v4
        with:
          name: huanban-build-apk-reports
          retention-days: 14
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
            build.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          pre-emulator-launch-script: |
            df -h .
            grep '^disk.dataPartition.size=' "$ANDROID_AVD_HOME/test.avd/config.ini"
          emulator-options: -no-window -gpu swangle -no-audio -no-boot-anim -no-snapshot -camera-back emulated
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            bash scripts/run_device_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huanban-device-tests-logs
          retention-days: 14
          path: |
            app/build/outputs/androidTest-results/
            evidence/device/
            build.log
